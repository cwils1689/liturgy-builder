<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liturgy Builder — Covenant Renewal Worship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --bg: #ECEFEA;
    --surface: #FFFFFF;
    --ink: #1B2A45;
    --ink-soft: #55637A;
    --ink-faint: #8A93A3;
    --border: #DADFD6;
    --gold: #A9812F;
    --call: #A9812F;
    --confession: #5B6B7A;
    --consecration: #7A2E3B;
    --communion: #5C2A52;
    --commission: #3F6B4A;
    --welcome: #3D6E74;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(27,42,69,0.06), 0 1px 8px rgba(27,42,69,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:900px;
    margin:0 auto;
    padding:32px 24px 120px;
  }
  header.masthead{
    text-align:center;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  header.masthead .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
  }
  header.masthead h1{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:32px;
    margin:6px 0 14px;
  }
  .service-meta{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .service-meta input{
    font-family:'Inter',sans-serif;
    font-size:13px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:7px 10px;
    background:var(--surface);
    color:var(--ink);
  }
  .service-meta input#serviceTitle{ min-width:220px; font-style:italic; }

  .sync-status{
    text-align:center;
    font-size:11.5px;
    margin-top:8px;
    color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sync-status .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; }
  .sync-status.is-synced .dot{ background:#3F6B4A; }
  .sync-status.is-synced{ color:#3F6B4A; }
  .sync-status.is-checking .dot{ background:var(--gold); }
  .sync-status.is-offline .dot{ background:#7A2E3B; }
  .sync-status.is-offline{ color:#7A2E3B; }
  .sync-status a{ color:inherit; text-decoration:underline; }

  .toolbar{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:32px;
  }
  .toolbar button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:var(--radius);
    padding:9px 14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .15s, color .15s;
  }
  .toolbar button:hover{ border-color:var(--ink-soft); }
  .toolbar button.primary{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .toolbar button.primary:hover{ background:#101b30; }
  .toolbar button.danger{ color:#8a3a3a; }

  .movement{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:5px solid var(--m-color, var(--gold));
    border-radius:var(--radius);
    margin-bottom:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .movement-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px 14px;
    border-bottom:1px solid var(--border);
  }
  .movement-head .icon{ width:22px; height:22px; flex-shrink:0; color:var(--m-color); }
  .movement-head h2{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    flex:1;
  }
  .movement-head .count{
    font-size:12px;
    color:var(--ink-faint);
    font-weight:500;
  }
  .elements{
    padding:10px 14px 14px;
    min-height:14px;
  }
  .element-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 12px 12px 10px;
    margin-bottom:10px;
    display:flex;
    gap:10px;
  }
  .element-card.sortable-ghost{ opacity:0.35; }
  .drag-handle{
    cursor:grab;
    color:var(--ink-faint);
    padding:2px 2px 0 0;
    user-select:none;
    line-height:1;
    font-size:16px;
    flex-shrink:0;
  }
  .element-body{ flex:1; min-width:0; }
  .element-row1{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .element-title{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:14.5px;
    border:none;
    background:transparent;
    color:var(--ink);
    flex:1;
    min-width:120px;
    padding:2px 0;
  }
  .element-title:focus{ outline:none; border-bottom:1px solid var(--m-color); }
  .type-select{
    font-size:11.5px;
    font-weight:600;
    border:1px solid var(--border);
    background:#fff;
    color:var(--ink-soft);
    border-radius:4px;
    padding:4px 6px;
  }
  .remove-btn{
    border:none;
    background:transparent;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 4px;
  }
  .remove-btn:hover{ color:#8a3a3a; }
  .reference-input{
    width:100%;
    font-size:12.5px;
    font-style:italic;
    color:var(--ink-soft);
    border:1px solid var(--border);
    border-radius:4px;
    padding:6px 8px;
    margin-bottom:6px;
    background:#fff;
  }
  .content-area{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    line-height:1.5;
    border:1px solid var(--border);
    border-radius:4px;
    padding:8px;
    resize:vertical;
    min-height:44px;
    background:#fff;
    color:var(--ink);
  }
  .content-area::placeholder, .reference-input::placeholder{ color:var(--ink-faint); font-style:italic; }

  .add-element{
    width:100%;
    background:transparent;
    border:1.5px dashed var(--border);
    color:var(--ink-faint);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    border-radius:var(--radius);
    padding:9px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-element:hover{ border-color:var(--m-color); color:var(--m-color); }

  .response-fields{ display:flex; flex-direction:column; gap:8px; }
  .response-line{ display:flex; align-items:flex-start; gap:8px; }
  .response-line label{
    font-size:11.5px; font-weight:600; color:var(--ink-soft);
    width:112px; flex-shrink:0; padding-top:6px;
  }
  .response-input, .alt-label-input, .version-select{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:13px;
    border:1px solid var(--border);
    border-radius:4px;
    padding:6px 8px;
    background:#fff;
    color:var(--ink);
    resize:vertical;
    min-height:34px;
    line-height:1.4;
  }
  select.version-select{ min-height:auto; resize:none; }
  .alt-toggle{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ink-soft); font-weight:600;
    margin-top:2px; cursor:pointer;
  }
  .alt-toggle input{ cursor:pointer; }
  .alt-fields{
    display:flex; flex-direction:column; gap:8px;
    border-left:2px solid var(--border);
    padding:8px 0 2px 10px;
    margin-top:2px;
  }
  .alt-label-input{ font-style:italic; }
  .print-response{ display:none; }
  .print-response p{ margin:2px 0 8px; font-size:13.5px; line-height:1.5; white-space:pre-line; }
  .print-response .speaker{ font-weight:600; }
  .print-response .footnote{ font-size:11.5px; font-style:italic; color:var(--ink-soft); }
  .hymn-fields{ display:flex; gap:8px; align-items:center; }
  .hymn-number-input{
    width:64px; flex-shrink:0;
    font-family:'Inter',sans-serif; font-size:13px;
    border:1px solid var(--border); border-radius:4px;
    padding:6px 8px; background:#fff; color:var(--ink);
    text-align:center;
  }
  .hymn-title-input{
    flex:1;
    font-family:'Spectral',serif; font-size:14px; font-style:italic;
    border:1px solid var(--border); border-radius:4px;
    padding:6px 8px; background:#fff; color:var(--ink);
  }
  .lectionary-row{
    border-top:1px solid var(--border);
    padding-top:8px; margin-top:8px;
  }
  .lectionary-row:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .lectionary-label{
    font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--m-color); margin-bottom:5px;
  }
  .locked-note{
    font-size:11px; color:var(--ink-faint); font-style:italic; margin-top:4px;
  }
  .skip-toggle{
    display:flex; align-items:center; gap:4px;
    font-size:11px; color:var(--ink-faint); font-weight:500;
    cursor:pointer; white-space:nowrap;
    margin-top:-2px;
  }
  .skip-toggle input{ cursor:pointer; }
  .lock-badge{
    font-size:12px;
    opacity:0.65;
    flex-shrink:0;
    cursor:default;
  }

  footer.note{
    text-align:center;
    color:var(--ink-faint);
    font-size:12px;
    margin-top:30px;
    line-height:1.6;
  }

  input[type=file]{ display:none; }

  /* ---- Print / PDF styles ---- */
  @media print{
    body{ background:#fff; }
    .toolbar{ display:none; }
    .app{ max-width:100%; padding:0 8px; }
    .movement{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; margin-bottom:14px; }
    .drag-handle, .remove-btn, .add-element, .type-select, .lock-badge{ display:none; }
    .element-card{ border:none; background:#fff; padding:6px 0; }
    .element-title, .reference-input, .content-area, .hymn-number-input, .hymn-title-input{ border:none; background:transparent; padding:0; }
    .content-area{ resize:none; }
    footer.note{ display:none; }
    .sync-status{ display:none; }
    .response-fields{ display:none; }
    .print-response{ display:block; }
    .text-hide-in-print{ display:none !important; }
    .alt-toggle{ display:none; }
    .lectionary-label{ color:var(--ink-soft) !important; }
    .skip-toggle{ display:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="eyebrow">Covenant Renewal Worship</div>
    <h1 contenteditable="true" id="churchTitle">Order of Worship</h1>
    <div class="service-meta">
      <input type="text" id="serviceTitle" placeholder="e.g. Second Sunday after Pentecost">
      <input type="date" id="serviceDate">
    </div>
    <div id="syncStatus" class="sync-status"></div>
  </header>

  <div class="toolbar">
    <button class="primary" onclick="window.print()">🖨 Export / Print to PDF</button>
    <button onclick="saveToFile()">💾 Save Liturgy File</button>
    <button onclick="document.getElementById('loadInput').click()">📂 Load Liturgy File</button>
    <button class="danger" onclick="resetTemplate()">↺ Reset to Default Template</button>
    <input type="file" id="loadInput" accept="application/json">
  </div>

  <div id="movements"></div>

  <footer class="note">
    Drag the ⠿ handle to reorder elements — within a movement, or between movements.<br>
    Save regularly to a file in your synced Zoho WorkDrive folder to keep a backup across devices.
  </footer>
</div>

    { title:'Reception of the Wine', type:'text', reference:'', content:'The cup of blessing is communion in the blood of Christ. Let us drink together.' },
    { title:'Proclamation of Remembrance', type:'response', reference:'', locked:true,
      leaderText:'For as often as you eat this bread and drink the cup, you proclaim the Lord\'s death until he comes. (1 Cor. 11:26)',
      peopleText:'We remember his death,\nWe proclaim his resurrection,\nWe await his coming in glory.' },
    { title:'Eucharistic Blessing', type:'response', reference:'', locked:true,
      leaderText:'Now may the body and blood of our Lord Jesus Christ strengthen and preserve you all steadfast in the most holy faith until life everlasting!',
      peopleText:'Amen!' },
    { title:'Hymn — Doxology', type:'hymn', locked:true, hymnNumber:'1076', hymnTitle:'Doxology' },
  ]},
  { key:'commission', label:'God Commissions Us with His Blessing', color:'var(--commission)', elements:[
    { title:'Charge', type:'text', reference:'', content:'' },
    { title:'Benediction', type:'scripture', reference:'', content:'' },
    { title:'Response', type:'response', reference:'', leaderText:'Amen!', peopleText:'Amen!' },
    { title:'Dismissal', type:'text', reference:'', content:'Go in peace.' },
  ]},
];

let state = null;
let idCounter = 1;
function newId(){ return 'el' + (idCounter++); }

function loadStateFromTemplate(template){
  state = template.map(m => ({
    key:m.key, label:m.label, color:m.color,
    elements: m.elements.map(e => ({ id:newId(), ...e }))
  }));
}

function render(){
  const container = document.getElementById('movements');
  container.innerHTML = '';
  state.forEach(movement => {
    const sec = document.createElement('section');
    sec.className = 'movement';
    sec.style.setProperty('--m-color', movement.color);

    sec.innerHTML = `
      <div class="movement-head">
        <span class="icon">${ICONS[movement.key] || ''}</span>
        <h2>${movement.label}</h2>
        <span class="count">${movement.elements.length} element${movement.elements.length===1?'':'s'}</span>
      </div>
      <div class="elements" data-movement="${movement.key}"></div>
      <div style="padding:0 14px 14px;">
        <button class="add-element" onclick="addElement('${movement.key}')">+ Add Element</button>
      </div>
    `;
    container.appendChild(sec);

    const list = sec.querySelector('.elements');
    movement.elements.forEach(el => list.appendChild(renderElement(el)));

    Sortable.create(list, {
      group: 'liturgy-elements',
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: syncStateFromDOM
    });
  });
}

function renderElement(el){
  const card = document.createElement('div');
  card.className = 'element-card';
  card.dataset.id = el.id;

  const header = `
    <div class="element-row1">
      <input class="element-title" value="${escapeAttr(el.title)}" placeholder="Element title" oninput="updateField('${el.id}','title',this.value)">
      ${el.locked ? '<span class="lock-badge" title="Standing text — part of every service">🔒</span>' : ''}
      <select class="type-select" onchange="updateField('${el.id}','type',this.value)">
        <option value="scripture" ${el.type==='scripture'?'selected':''}>Scripture</option>
        <option value="text" ${el.type==='text'?'selected':''}>Text / Prayer</option>
        <option value="response" ${el.type==='response'?'selected':''}>Congregational Response</option>
        <option value="rubric" ${el.type==='rubric'?'selected':''}>Rubric</option>
        <option value="hymn" ${el.type==='hymn'?'selected':''}>Hymn</option>
        <option value="lectionary" ${el.type==='lectionary'?'selected':''}>Lectionary</option>
        <option value="variant-text" ${el.type==='variant-text'?'selected':''}>Prayer (multiple versions)</option>
        <option value="exhortation" ${el.type==='exhortation'?'selected':''}>Exhortation</option>
        <option value="sermon" ${el.type==='sermon'?'selected':''}>Sermon</option>
      </select>
      ${el.locked ? '' : `<button class="remove-btn" title="Remove" onclick="removeElement('${el.id}')">✕</button>`}
    </div>
  `;

  let body;
  if(el.type === 'hymn'){
    body = `
      <div class="hymn-fields">
        <input class="hymn-number-input" placeholder="No." value="${escapeAttr(el.hymnNumber)}" oninput="updateField('${el.id}','hymnNumber',this.value)">
        <input class="hymn-title-input" placeholder="Hymn title" value="${escapeAttr(el.hymnTitle)}" oninput="updateField('${el.id}','hymnTitle',this.value)">
      </div>
    `;
  } else if(el.type === 'exhortation'){
    body = `
      <input class="reference-input" placeholder="Title of the exhortation" value="${escapeAttr(el.subtitle)}" oninput="updateField('${el.id}','subtitle',this.value)">
      <textarea class="content-area" placeholder="Exhortation manuscript…" style="min-height:110px" oninput="updateField('${el.id}','content',this.value)">${escapeHTML(el.content)}</textarea>
    `;
  } else if(el.type === 'sermon'){
    body = `
      <input class="reference-input" placeholder="Sermon title" value="${escapeAttr(el.sermonTitle)}" oninput="updateField('${el.id}','sermonTitle',this.value)">
      <input class="reference-input" placeholder="Sermon text (e.g. Jonah 1:4-10)" value="${escapeAttr(el.passageReference)}" oninput="updateField('${el.id}','passageReference',this.value)">
      <label class="alt-toggle">
        <input type="checkbox" ${el.hasManuscript?'checked':''} onchange="updateField('${el.id}','hasManuscript',this.checked)">
        Include a manuscript text box
      </label>
      ${el.hasManuscript ? `<textarea class="content-area" placeholder="Sermon manuscript…" style="min-height:110px" oninput="updateField('${el.id}','manuscript',this.value)">${escapeHTML(el.manuscript)}</textarea>` : ''}
    `;
  } else if(el.type === 'variant-text'){
    const activeId = el.activeVariantId || (el.variants[0] && el.variants[0].id);
    const active = el.variants.find(v => v.id === activeId) || el.variants[0];
    const options = el.variants.map(v => `<option value="${v.id}" ${v.id===activeId?'selected':''}>${escapeHTML(v.label)}</option>`).join('');
    body = `
      <div class="response-fields">
        <div class="response-line">
          <label>Version</label>
          <select class="version-select" onchange="updateField('${el.id}','activeVariantId',this.value)">${options}</select>
        </div>
        <textarea class="content-area" placeholder="Prayer text…" oninput="updateVariantContent('${el.id}','${active.id}',this.value)">${escapeHTML(active.content)}</textarea>
        <button class="add-element" onclick="addVariant('${el.id}')">+ Add &amp; save a new version</button>
      </div>
      <div class="print-response"><p>${escapeHTML(active.content)}</p></div>
    `;
  } else if(el.type === 'response'){
    const toggleLabel = el.altMode==='replace'
      ? `Use the ${escapeHTML(el.altLabel)||'seasonal'} version this week (replaces the text above)`
      : `Add this ${escapeHTML(el.altLabel)||'seasonal'} exchange this week (goes before the text above)`;
    body = `
      <div class="response-fields">
        <div class="response-line">
          <label>Leader says</label>
          <textarea class="response-input" placeholder="e.g. The Lord be with you!" oninput="updateField('${el.id}','leaderText',this.value)">${escapeHTML(el.leaderText)}</textarea>
        </div>
        <label class="skip-toggle" title="Leave the Leader's line out of this week's printed liturgy (e.g. if the passage above already ends in Amen)">
          <input type="checkbox" ${el.skipLeader?'checked':''} onchange="updateField('${el.id}','skipLeader',this.checked)">
          Skip the Leader's line this week
        </label>
        <div class="response-line">
          <label>People respond</label>
          <textarea class="response-input" placeholder="e.g. And also with you!" oninput="updateField('${el.id}','peopleText',this.value)">${escapeHTML(el.peopleText)}</textarea>
        </div>
        ${el.hasFootnote ? `
        <div class="response-line">
          <label>Footnote (optional)</label>
          <input class="response-input" style="min-height:auto" placeholder="Explanatory note shown under the text, e.g. *catholic means universal…" value="${escapeAttr(el.footnote)}" oninput="updateField('${el.id}','footnote',this.value)">
        </div>` : ''}
        ${el.allowSeasonal ? `
        <label class="alt-toggle">
          <input type="checkbox" ${el.hasAlt?'checked':''} onchange="updateField('${el.id}','hasAlt',this.checked)">
          Has a seasonal variant
        </label>
        ${el.hasAlt ? `
        <div class="alt-fields">
          <input class="alt-label-input" placeholder="Season name (e.g. Eastertide)" value="${escapeAttr(el.altLabel)}" oninput="updateField('${el.id}','altLabel',this.value)">
          <div class="response-line">
            <label>Leader (alt.)</label>
            <textarea class="response-input" oninput="updateField('${el.id}','altLeaderText',this.value)">${escapeHTML(el.altLeaderText)}</textarea>
          </div>
          <div class="response-line">
            <label>People (alt.)</label>
            <textarea class="response-input" oninput="updateField('${el.id}','altPeopleText',this.value)">${escapeHTML(el.altPeopleText)}</textarea>
          </div>
          ${el.hasFootnote ? `
          <div class="response-line">
            <label>Footnote (alt.)</label>
            <input class="response-input" style="min-height:auto" placeholder="Same footnote, if unchanged" value="${escapeAttr(el.altFootnote)}" oninput="updateField('${el.id}','altFootnote',this.value)">
          </div>` : ''}
          <label class="alt-toggle">
            <input type="checkbox" ${el.altActive?'checked':''} onchange="updateField('${el.id}','altActive',this.checked)">
            ${toggleLabel}
          </label>
        </div>` : ''}` : ''}
      </div>
      <div class="print-response">${buildResponsePrintHTML(el)}</div>
    `;
  } else if(el.type === 'lectionary'){
    const rows = el.readings.map(r => `
      <div class="lectionary-row">
        <div class="lectionary-label">${escapeHTML(r.label)}</div>
        <input class="reference-input" placeholder="${escapeAttr(r.label)} reference" value="${escapeAttr(r.reference)}" oninput="updateReadingField('${el.id}','${r.key}','reference',this.value)">
        <textarea class="content-area${el.includeText ? '' : ' text-hide-in-print'}" placeholder="Passage text (optional)" oninput="updateReadingField('${el.id}','${r.key}','content',this.value)">${escapeHTML(r.content)}</textarea>
      </div>
    `).join('');
    body = `
      ${rows}
      <label class="alt-toggle">
        <input type="checkbox" ${el.includeText?'checked':''} onchange="updateField('${el.id}','includeText',this.checked)">
        Include full text for these readings in the printed liturgy
      </label>
    `;
  } else {
    body = `
      ${el.type==='scripture' ? `<input class="reference-input" placeholder="Scripture reference (e.g. Psalm 95:1-7)" value="${escapeAttr(el.reference)}" oninput="updateField('${el.id}','reference',this.value)">` : ''}
      <textarea class="content-area" placeholder="${placeholderFor(el.type)}" oninput="updateField('${el.id}','content',this.value)">${escapeHTML(el.content)}</textarea>
    `;
  }

  card.innerHTML = `
    <span class="drag-handle">⠿</span>
    <div class="element-body">${header}${body}</div>
  `;
  return card;
}

function updateReadingField(id, key, field, value){
  const el = findEl(id);
  if(!el || !el.readings) return;
  const r = el.readings.find(r => r.key === key);
  if(r) r[field] = value;
}

function placeholderFor(type){
  if(type==='scripture') return 'Paste or type the passage text here (optional)…';
  if(type==='rubric') return 'Instruction for congregation/leader (e.g. "If you are able, let us kneel together…")';
  return 'Prayer, exhortation, or custom text…';
}

function buildResponsePrintHTML(el){
  const useAlt = el.allowSeasonal && el.hasAlt && el.altActive;
  let html = '';
  if(useAlt && el.altMode === 'replace'){
    html += `<p><span class="speaker">Leader:</span> ${escapeHTML(el.altLeaderText)}</p><p><span class="speaker">People:</span> ${escapeHTML(el.altPeopleText)}</p>`;
    const fn = el.altFootnote || el.footnote;
    if(fn) html += `<p class="footnote">${escapeHTML(fn)}</p>`;
    return html;
  }
  if(useAlt){
    html += `<p><span class="speaker">Leader:</span> ${escapeHTML(el.altLeaderText)}</p><p><span class="speaker">People:</span> ${escapeHTML(el.altPeopleText)}</p>`;
  }
  if(!el.skipLeader) html += `<p><span class="speaker">Leader:</span> ${escapeHTML(el.leaderText)}</p>`;
  html += `<p><span class="speaker">People:</span> ${escapeHTML(el.peopleText)}</p>`;
  if(el.footnote) html += `<p class="footnote">${escapeHTML(el.footnote)}</p>`;
  return html;
}

function findEl(id){
  for(const m of state) for(const e of m.elements) if(e.id===id) return e;
  return null;
}

function updateField(id, field, value){
  const el = findEl(id);
  if(!el) return;
  el[field] = value;
  if(field === 'type' && value === 'lectionary' && !el.readings){
    el.readings = [
      { key:'ot', label:'Old Testament', reference:'', content:'' },
      { key:'psalm', label:'Psalm', reference:'', content:'' },
      { key:'nt', label:'New Testament', reference:'', content:'' },
      { key:'gospel', label:'Gospel', reference:'', content:'' },
    ];
    el.includeText = false;
  }
  if(field === 'type' && value === 'variant-text' && !el.variants){
    el.variants = [{ id:'v'+Date.now(), label:'Standard', content:'' }];
    el.activeVariantId = el.variants[0].id;
  }
  if(['type','hasAlt','hasManuscript','includeText','activeVariantId'].includes(field)){ render(); return; }
  if(el.type === 'response') refreshResponsePrint(id);
}

function updateVariantContent(id, variantId, value){
  const el = findEl(id);
  if(!el || !el.variants) return;
  const v = el.variants.find(v => v.id === variantId);
  if(v) v.content = value;
  const target = document.querySelector(`.element-card[data-id="${id}"] .print-response p`);
  if(target) target.textContent = value;
}

function addVariant(id){
  const el = findEl(id);
  if(!el || !el.variants) return;
  const label = prompt('Who is this version for? (e.g. a minister\'s name)', '');
  if(label === null) return;
  const newVariant = { id:'v'+Date.now(), label: label.trim() || 'New Version', content:'' };
  el.variants.push(newVariant);
  el.activeVariantId = newVariant.id;
  render();
}

function refreshResponsePrint(id){
  const el = findEl(id);
  const target = document.querySelector(`.element-card[data-id="${id}"] .print-response`);
  if(target) target.innerHTML = buildResponsePrintHTML(el);
}

function removeElement(id){
  for(const m of state){
    const idx = m.elements.findIndex(e => e.id===id);
    if(idx>-1){ m.elements.splice(idx,1); render(); return; }
  }
}

function addElement(movementKey){
  const m = state.find(x => x.key===movementKey);
  m.elements.push({ id:newId(), title:'New Element', type:'text', reference:'', content:'' });
  render();
}

function syncStateFromDOM(){
  const container = document.getElementById('movements');
  const lists = container.querySelectorAll('.elements');
  const newState = [];
  lists.forEach(list => {
    const key = list.dataset.movement;
    const movement = state.find(m => m.key === key);
    const ids = Array.from(list.children).map(c => c.dataset.id);
    const elements = ids.map(id => findEl(id));
    newState.push({ ...movement, elements });
  });
  state = newState;
}

function escapeHTML(str){
  return (str||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(str){
  return (str||'').replace(/"/g,'&quot;');
}

function resetTemplate(){
  if(!confirm('Reset to the default Covenant Renewal Worship template? Unsaved changes will be lost.')) return;
  loadStateFromTemplate(DEFAULT_TEMPLATE);
  document.getElementById('serviceTitle').value = '';
  document.getElementById('serviceDate').value = '';
  render();
}

function saveToFile(){
  const payload = {
    churchTitle: document.getElementById('churchTitle').innerText,
    serviceTitle: document.getElementById('serviceTitle').value,
    serviceDate: document.getElementById('serviceDate').value,
    movements: state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = payload.serviceDate || new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `liturgy-${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('loadInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = JSON.parse(evt.target.result);
      document.getElementById('churchTitle').innerText = data.churchTitle || 'Order of Worship';
      document.getElementById('serviceTitle').value = data.serviceTitle || '';
      document.getElementById('serviceDate').value = data.serviceDate || '';
      state = data.movements.map(m => ({
        ...m,
        elements: m.elements.map(el => ({ ...el, id: newId() }))
      }));
      render();
    }catch(err){
      alert('Could not read that file. Please make sure it is a liturgy file saved from this app.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------------------------------------------------------------------
   Liturgical calendar engine — computed entirely offline (no network,
   no external lectionary data needed) from the date alone:
   - Easter via the standard Gregorian algorithm
   - Season / Sunday name (e.g. "Third Sunday after the Epiphany")
   - RCL Year A/B/C  (anchored: Advent 2025 = Year A, confirmed against
     the published 2026-2027 RCL calendar)
   - Whether Eastertide / Advent–Christmastide is in effect, to drive
     the Greeting and Creed seasonal toggles automatically
   Note: named special Sundays (Trinity Sunday, Christ the King,
   Baptism of the Lord, Transfiguration, All Saints) aren't labeled by
   name — they'll show as their season/number instead. The subtitle
   field stays a normal text box, so it's always easy to hand-correct.
--------------------------------------------------------------------- */
function computeEaster(year){
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function daysBetween(a, b){ return Math.round((b - a) / 86400000); }
function sundayOnOrBefore(date){ return addDays(date, -date.getDay()); }
function sundayOnOrAfter(date){ return date.getDay() === 0 ? date : addDays(date, 7 - date.getDay()); }
function closestSunday(date){
  const before = sundayOnOrBefore(date), after = sundayOnOrAfter(date);
  return (after - date) < (date - before) ? after : before;
}
function adventSunday(year){ return closestSunday(new Date(year, 10, 30)); }
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function getLiturgicalInfo(dateStr){
  if(!dateStr) return null;
  const [Y, M, D] = dateStr.split('-').map(Number);
  const date = new Date(Y, M - 1, D);
  const easter = computeEaster(Y);
  const ashWed = addDays(easter, -46);
  const palmSunday = addDays(easter, -7);
  const pentecost = addDays(easter, 49);
  const epiphany = new Date(Y, 0, 6);
  const christmasThis = new Date(Y, 11, 25);
  const adventThis = adventSunday(Y);

  let label, isEastertide = false, isAdventOrChristmastide = false, yearAnchor;

  if(date < epiphany){
    label = 'Christmastide'; isAdventOrChristmastide = true; yearAnchor = Y - 1;
  } else if(date < ashWed){
    const weeks = Math.max(1, Math.round(daysBetween(epiphany, date) / 7) + 1);
    label = `${ordinal(weeks)} Sunday after the Epiphany`; yearAnchor = Y - 1;
  } else if(date < easter){
    if(daysBetween(date, palmSunday) === 0){ label = 'Palm Sunday'; }
    else { const weeks = Math.max(1, Math.round(daysBetween(ashWed, date) / 7)); label = `${ordinal(weeks)} Sunday in Lent`; }
    yearAnchor = Y - 1;
  } else if(date < pentecost){
    const weeks = Math.round(daysBetween(easter, date) / 7) + 1;
    label = weeks <= 1 ? 'Easter Sunday' : `${ordinal(weeks)} Sunday of Easter`;
    isEastertide = true; yearAnchor = Y - 1;
  } else if(daysBetween(date, pentecost) === 0){
    label = 'Day of Pentecost'; yearAnchor = Y - 1;
  } else if(date < adventThis){
    const may11 = new Date(Y, 4, 11);
    const proper = Math.min(29, Math.max(1, Math.round(daysBetween(may11, date) / 7) + 1));
    const afterPentecostWeeks = Math.round(daysBetween(pentecost, date) / 7) + 1;
    label = `${ordinal(afterPentecostWeeks)} Sunday after Pentecost (Proper ${proper})`;
    yearAnchor = Y - 1;
  } else if(date < christmasThis){
    const weeks = Math.round(daysBetween(adventThis, date) / 7) + 1;
    label = `${ordinal(weeks)} Sunday of Advent`; isAdventOrChristmastide = true; yearAnchor = Y;
  } else {
    label = 'Christmastide'; isAdventOrChristmastide = true; yearAnchor = Y;
  }

  const letters = ['A','B','C'];
  const rclYear = letters[((yearAnchor - 2025) % 3 + 3) % 3];
  return { label, rclYear, isEastertide, isAdventOrChristmastide, yearAnchor };
}

function onDateChange(){
  const dateStr = document.getElementById('serviceDate').value;
  if(!dateStr) return;
  const info = getLiturgicalInfo(dateStr);
  if(!info) return;
  document.getElementById('serviceTitle').value = `${info.label} (Year ${info.rclYear})`;
  state.forEach(m => m.elements.forEach(e => {
    if(e.type === 'response' && e.allowSeasonal){
      e.altActive = e.altMode === 'replace' ? info.isAdventOrChristmastide : info.isEastertide;
    }
  }));
  render();
  syncLectionary(dateStr);
}
document.getElementById('serviceDate').addEventListener('change', onDateChange);

/* ---------------------------------------------------------------------
   RCL lookup — static, embedded, offline. No network requests, so it
   can't fail from a browser security block or a source going down.
   Covers the current two RCL cycles (Year A: Nov 2025-Nov 2026, Year
   B: Nov 2026-Nov 2027) by exact Sunday/feast date, sourced from the
   Vanderbilt Divinity Library's published RCL citation lists. Outside
   that date range, or for a date that isn't a Sunday/feast on the

function setSyncStatus(state, message){
  const box = document.getElementById('syncStatus');
  box.className = 'sync-status is-' + state;
  box.innerHTML = `<span class="dot"></span> ${message}`;
}

function findLectionaryElement(){
  for(const m of state) for(const e of m.elements) if(e.type === 'lectionary') return e;
  return null;
}

function lookupLink(dateStr){
  const info = getLiturgicalInfo(dateStr);
  const y = info ? info.yearAnchor : new Date(dateStr).getFullYear();
  return `https://lectionary.library.vanderbilt.edu/calendar/${y}-${String(y + 1).slice(-2)}/?season=all`;
}

const BCP_DATA = {"First Sunday of Advent":["Almighty God, give us grace to cast away the works of darkness, and put on the armor of light, now in the time of this mortal life in which your Son Jesus Christ came to visit us in great humility; that in the last day, when he shall come again in his glorious majesty to judge both the living and the dead, we may rise to the life immortal; through him who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Second Sunday of Advent":["Merciful God, who sent your messengers the prophets to preach repentance and prepare the way for our salvation: Give us grace to heed their warnings and forsake our sins, that we may greet with joy the coming of Jesus Christ our Redeemer; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Third Sunday of Advent":["Stir up your power, O Lord, and with great might come among us; and, because we are sorely hindered by our sins, let your bountiful grace and mercy speedily help and deliver us; through Jesus Christ our Lord, to whom, with you and the Holy Spirit, be honor and glory, now and for ever. Amen."],"Fourth Sunday of Advent":["Purify our conscience, Almighty God, by your daily visitation, that your Son Jesus Christ, at his coming, may find in us a mansion prepared for himself; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."],"Nativity of the Lord (Christmas)":["O God, you make us glad by the yearly festival of the birth of your only Son Jesus Christ: Grant that we, who joyfully receive him as our Redeemer, may with sure confidence behold him when he comes to be our Judge; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen.","O God, you have caused this holy night to shine with the brightness of the true Light: Grant that we, who have known the mystery of that Light on earth, may also enjoy him perfectly in heaven; where with you and the Holy Spirit he lives and reigns, one God, in glory everlasting. Amen.","Almighty God, you have given your only-begotten Son to take our nature upon him, and to be born of a pure virgin: Grant that we, who have been born again and made your children by adoption and grace, may daily be renewed by your Holy Spirit; through our Lord Jesus Christ, to whom with you and the same Spirit be honor and glory, now and for ever. Amen."],"First Sunday after Christmas Day":["Almighty God, you have poured upon us the new light of your incarnate Word: Grant that this light, enkindled in our hearts, may shine forth in our lives; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."],"Holy Name of Jesus":["Eternal Father, you gave to your incarnate Son the holy name of Jesus to be the sign of our salvation: Plant in every heart, we pray, the love of him who is the Savior of the world, our Lord Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."],"Second Sunday after Christmas":["O God, who wonderfully created, and yet more wonderfully restored, the dignity of human nature: Grant that we may share the divine life of him who humbled himself to share our humanity, your Son Jesus Christ; who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."],"Epiphany of the Lord":["O God, by the leading of a star you manifested your only Son to the Peoples of the earth: Lead us, who know you now by faith, to your presence, where we may see your glory face to face; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Baptism of the Lord":["Father in heaven, who at the baptism of Jesus in the River Jordan proclaimed him your beloved Son and anointed him with the Holy Spirit: Grant that all who are baptized into his Name may keep the covenant they have made, and boldly confess him as Lord and Savior; who with you and the Holy Spirit lives and reigns, one God, in glory everlasting. Amen."],"Second Sunday after the Epiphany":["Almighty God, whose Son our Savior Jesus Christ is the light of the world: Grant that your people, illumined by your Word and Sacraments, may shine with the radiance of Christ's glory, that he may be known, worshiped, and obeyed to the ends of the earth; through Jesus Christ our Lord, who with you and the Holy Spirit lives and reigns, one God, now and for ever. Amen."],"Third Sunday after the Epiphany":["Give us grace, O Lord, to answer readily the call of our Savior Jesus Christ and proclaim to all people the Good News of his salvation, that we and the whole world may perceive the glory of his marvelous works; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Fourth Sunday after the Epiphany":["Almighty and everlasting God, you govern all things both in heaven and on earth: Mercifully hear the supplications of your people, and in our time grant us your peace; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Fifth Sunday after the Epiphany":["Set us free, O God, from the bondage of our sins, and give us the liberty of that abundant life which you have made known to us in your Son our Savior Jesus Christ; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."],"Transfiguration Sunday":["O God, who before the passion of your only-begotten Son revealed his glory upon the holy mountain: Grant to us that we, beholding by faith the light of his countenance, may be strengthened to bear our cross, and be changed into his likeness from glory to glory; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Ash Wednesday":["Almighty and everlasting God, you hate nothing you have made and forgive the sins of all who are penitent: Create and make in us new and contrite hearts, that we, worthily lamenting our sins and acknowledging our wretchedness, may obtain of you, the God of all mercy, perfect remission and forgiveness; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"First Sunday in Lent":["Almighty God, whose blessed Son was led by the Spirit to be tempted by Satan: Come quickly to help us who are assaulted by many temptations; and, as you know the weaknesses of each of us, let each one find you mighty to save; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Second Sunday in Lent":["O God, whose glory it is always to have mercy: Be gracious to all who have gone astray from your ways, and bring them again with penitent hearts and steadfast faith to embrace and hold fast the unchangeable truth of your Word, Jesus Christ your Son; who with you and the Holy Spirit lives and reigns, one God, for ever and ever. Amen."],"Third Sunday in Lent":["Almighty God, you know that we have no power in ourselves to help ourselves: Keep us both outwardly in our bodies and inwardly in our souls, that we may be defended from all adversities which may happen to the body, and from all evil thoughts which may assault and hurt the soul; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Fourth Sunday in Lent":["Gracious Father, whose blessed Son Jesus Christ came down from heaven to be the true bread which gives life to the world: Evermore give us this bread, that he may live in us, and we in him; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Fifth Sunday in Lent":["Almighty God, you alone can bring into order the unruly wills and affections of sinners: Grant your people grace to love what you command and desire what you promise; that, among the swift and varied changes of the world, our hearts may surely there be fixed where true joys are to be found; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Liturgy of the Passion":["Almighty and everliving God, in your tender love for the human race you sent your Son our Savior Jesus Christ to take upon him our nature, and to suffer death upon the cross, giving us the example of his great humility: Mercifully grant that we may walk in the way of his suffering, and also share in his resurrection; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Monday of Holy Week":["Almighty God, whose dear Son went not up to joy but first he suffered pain, and entered not into glory before he was crucified: Mercifully grant that we, walking in the way of the cross, may find it none other that the way of life and peace; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Tuesday of Holy Week":["O God, by the passion of your blessed Son you made an instrument of shameful death to be for us the means of life: Grant us so to glory in the cross of Christ, that we may gladly suffer shame and loss for the sake of your Son our Savior Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Wednesday of Holy Week":["Lord God, whose blessed Son our Savior gave his body to be whipped and his face to be spit upon: Give us grace to accept joyfully the sufferings of the present time, confident of the glory that shall be revealed; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Maundy Thursday":["Almighty Father, whose dear Son, on the night before he suffered, instituted the Sacrament of his Body and Blood: Mercifully grant that we may receive it thankfully in remembrance of Jesus Christ our Lord, who in these holy mysteries gives us a pledge of eternal life; and who now lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Good Friday":["Almighty God, we pray you graciously to behold this your family, for whom our Lord Jesus Christ was willing to be betrayed, and given into the hands of sinners, and to suffer death upon the cross; who now lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Resurrection of the Lord":["O God, who for our redemption gave your only-begotten Son to the death of the cross, and by his glorious resurrection delivered us from the power of our enemy: Grant us so to die daily to sin, that we may evermore live with him in the joy of his resurrection; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen.","O God, who made this most holy night to shine with the glory of the Lord's resurrection: Stir up in your Church that Spirit of adoption which is given to us in Baptism, that we, being renewed both in body and mind, may worship you in sincerity and truth; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen.","Almighty God, who through your only-begotten Son Jesus Christ overcame death and opened to us the gate of everlasting life: Grant that we, who celebrate with joy the day of the Lord's resurrection, may be raised from the death of sin by your life-giving Spirit; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Second Sunday of Easter":["Almighty and everlasting God, who in the Paschal mystery established the new covenant of reconciliation: Grant that all who have been reborn into the fellowship of Christ's Body may show forth in their lives what they profess by their faith; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Third Sunday of Easter":["O God, whose blessed Son made himself known to his disciples in the breaking of bread: Open the eyes of our faith, that we may behold him in all his redeeming work; who lives and reigns with you, in the unity of the Holy Spirit, one God, now and for ever. Amen."],"Fourth Sunday of Easter":["O God, whose Son Jesus is the good shepherd of your people; Grant that when we hear his voice we may know him who calls us each by name, and follow where he leads; who, with you and the Holy Spirit, lives and reigns, one God, for ever and ever. Amen."],"Fifth Sunday of Easter":["Almighty God, whom truly to know is everlasting life: Grant us so perfectly to know your Son Jesus Christ to be the way, the truth, and the life, that we may steadfastly follow his steps in the way that leads to eternal life; through Jesus Christ your Son our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."],"Sixth Sunday of Easter":["O God, you have prepared for those who love you such good things as surpass our understanding: Pour into our hearts such love towards you, that we, loving you in all things and above all things, may obtain your promises, which exceed all that we can desire; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Ascension of the Lord":["Almighty God, whose blessed Son our Savior Jesus Christ ascended far above all heavens that he might fill all things: Mercifully give us faith to perceive that, according to his promise, he abides with his Church on earth, even to the end of the ages; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen.","Grant, we pray, Almighty God, that as we believe your only-begotten Son our Lord Jesus Christ to have ascended into heaven, so we may also in heart and mind there ascend, and with him continually dwell; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Seventh Sunday of Easter":["O God, the King of glory, you have exalted your only Son Jesus Christ with great triumph to your kingdom in heaven: Do not leave us comfortless, but send us your Holy Spirit to strengthen us, and exalt us to that place where our Savior Christ has gone before; who lives and reigns with you and the Holy Spirit, one God, in glory everlasting. Amen."],"Day of Pentecost":["Almighty God, on this day you opened the way of eternal life to every race and nation by the promised gift of your Holy Spirit: Shed abroad this gift throughout the world by the preaching of the Gospel, that it may reach to the ends of the earth; through Jesus Christ our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen.","O God, who on this day taught the hearts of your faithful people by sending to them the light of your Holy Spirit: Grant us by the same Spirit to have a right judgment in all things, and evermore to rejoice in his holy comfort; through Jesus Christ your Son our Lord, who lives and reigns with you, in the unity of the Holy Spirit, one God, for ever and ever. Amen."],"Trinity Sunday":["Almighty and everlasting God, you have given to us your servants grace, by the confession of a true faith, to acknowledge the glory of the eternal Trinity, and in the power of your divine Majesty to worship the Unity: Keep us steadfast in this faith and worship, and bring us at last to see you in your one and eternal glory, O Father; who with the Son and the Holy Spirit live and reign, one God, for ever and ever. Amen."],"Reign of Christ":["Almighty and everlasting God, whose will it is to restore all things in your well-beloved Son, the King of kings and Lord of lords: Mercifully grant that the peoples of the earth, divided and enslaved by sin, may be freed and brought together under his most gracious rule; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 1":["Remember, O Lord, what you have wrought in us and not what we deserve; and, as you have called us to your service, make us worthy of our calling; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 2":["Almighty and merciful God, in your goodness keep us, we pray, from all things that may hurt us, that we, being ready both in mind and body, may accomplish with free hearts those things which belong to your purpose; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 3":["Grant, O Lord, that the course of this world may be peaceably governed by your providence; and that your Church may joyfully serve you in confidence and serenity; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 4":["O God, your never-failing providence sets in order all things both in heaven and earth: Put away from us, we entreat you, all hurtful things, and give us those things which are profitable for us; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 5":["O God, from whom all good proceeds: Grant that by your inspiration we may think those things that are right, and by your merciful guiding may do them; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 6":["Keep, O Lord, your household the Church in your steadfast faith and love, that through your grace we may proclaim your truth with boldness, and minister your justice with compassion; for the sake of our Savior Jesus Christ, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 7":["O Lord, make us have perpetual love and reverence for your holy Name, for you never fail to help and govern those whom you have set upon the sure foundation of your loving-kindness; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 8":["Almighty God, you have built your Church upon the foundation of the apostles and prophets, Jesus Christ himself being the chief cornerstone: Grant us so to be joined together in unity of spirit by their teaching, that we may be made a holy temple acceptable to you; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 9":["O God, you have taught us to keep all your commandments by loving you and our neighbor: Grant us the grace of your Holy Spirit, that we may be devoted to you with our whole heart, and united to one another with pure affection; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 10":["O Lord, mercifully receive the prayers of your people who call upon you, and grant that they may know and understand what things they ought to do, and also may have grace and power faithfully to accomplish them; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 11":["Almighty God, the fountain of all wisdom, you know our necessities before we ask and our ignorance in asking: Have compassion on our weakness, and mercifully give us those things which for our unworthiness we dare not, and for our blindness we cannot ask; through the worthiness of your Son Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 12":["O God, the protector of all who trust in you, without whom nothing is strong, nothing is holy: Increase and multiply upon us your mercy; that, with you as our ruler and guide, we may so pass through things temporal, that we lose not the things eternal; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 13":["Let your continual mercy, O Lord, cleanse and defend your Church; and, because it cannot continue in safety without your help, protect and govern it always by your goodness; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 14":["Grant to us, Lord, we pray, the spirit to think and do always those things that are right, that we, who cannot exist without you, may by you be enabled to live according to your will; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 15":["Almighty God, you have given your only Son to be for us a sacrifice for sin, and also an example of godly life: Give us grace to receive thankfully the fruits of his redeeming work, and to follow daily in the blessed steps of his most holy life; through Jesus Christ your Son our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 16":["Grant, O merciful God, that your Church, being gathered together in unity by your Holy Spirit, may show forth your power among all peoples, to the glory of your Name; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 17":["Lord of all power and might, the author and giver of all good things: Graft in our hearts the love of your Name; increase in us true religion; nourish us with all goodness; and bring forth in us the fruit of good works; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 18":["Grant us, O Lord, to trust in you with all our hearts; for, as you always resist the proud who confide in their own strength, so you never forsake those who make their boast of your mercy; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 19":["O God, because without you we are not able to please you, mercifully grant that your Holy Spirit may in all things direct and rule our hearts; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 20":["Grant us, Lord, not to be anxious about earthly things, but to love things heavenly; and even now, while we are placed among things that are passing away, to hold fast to those that shall endure; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 21":["O God, you declare your almighty power chiefly in showing mercy and pity: Grant us the fullness of your grace, that we, running to obtain your promises, may become partakers of your heavenly treasure; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 22":["Almighty and everlasting God, you are always more ready to hear than we to pray, and to give more than we either desire or deserve: Pour upon us the abundance of your mercy, forgiving us those things of which our conscience is afraid, and giving us those good things for which we are not worthy to ask, except through the merits and mediation of Jesus Christ our Savior; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 23":["Lord, we pray that your grace may always precede and follow us, that we may continually be given to good works; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 24":["Almighty and everlasting God, in Christ you have revealed your glory among the nations: Preserve the works of your mercy, that your Church throughout the world may persevere with steadfast faith in the confession of your Name; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 25":["Almighty and everlasting God, increase in us the gifts of faith, hope, and charity; and, that we may obtain what you promise, make us love what you command; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 26":["Almighty and merciful God, it is only by your gift that your faithful people offer you true and laudable service: Grant that we may run without stumbling to obtain your heavenly promises; through Jesus Christ our Lord, who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."],"Proper 27":["O God, whose blessed Son came into the world that he might destroy the works of the devil and make us children of God and heirs of eternal life: Grant that, having this hope, we may purify ourselves as he is pure; that, when he comes again with power and great glory, we may be made like him in his eternal and glorious kingdom; where he lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 28":["Blessed Lord, who caused all holy Scriptures to be written for our learning: Grant us so to hear them, read, mark, learn, and inwardly digest them, that we may embrace and ever hold fast the blessed hope of everlasting life, which you have given us in our Savior Jesus Christ; who lives and reigns with you and the Holy Spirit, one God, for ever and ever. Amen."],"Proper 29":["Almighty and everlasting God, whose will it is to restore all things in your well-beloved Son, the King of kings and Lord of lords: Mercifully grant that the peoples of the earth, divided and enslaved by sin, may be freed and brought together under his most gracious rule; who lives and reigns with you and the Holy Spirit, one God, now and for ever. Amen."]};

function findCollectElement(){
  for(const m of state) for(const e of m.elements) if(e.bcpLinked) return e;
  return null;
}

function bcpOptionsFor(entry){
  if(!entry) return null;
  const properMatch = entry.name.match(/^Proper (\d+)/);
  if(properMatch) return BCP_DATA['Proper ' + properMatch[1]] || null;
  return BCP_DATA[entry.name] || null;
}

function syncLectionary(dateStr){
  const lec = findLectionaryElement();
  const col = findCollectElement();
  const link = `<a href="${lookupLink(dateStr)}" target="_blank" rel="noopener">Look it up →</a>`;
  const entry = RCL_DATA[dateStr];
  if(!entry){
    setSyncStatus('offline', `No RCL data on file for this date. ${link}`);
    return;
  }
  let filled = [];
  if(lec){
    lec.readings.find(r=>r.key==='ot').reference = entry.ot;
    lec.readings.find(r=>r.key==='psalm').reference = entry.psalm;
    lec.readings.find(r=>r.key==='nt').reference = entry.nt;
    lec.readings.find(r=>r.key==='gospel').reference = entry.gospel;
    filled.push('readings');
  }
  const collectOptions = bcpOptionsFor(entry);
  if(col && collectOptions){
    col.variants = collectOptions.map((text, i) => ({
      id: 'bcp' + i,
      label: collectOptions.length > 1 ? `Option ${i + 1}` : 'Standard',
      content: text
    }));
    col.activeVariantId = col.variants[0].id;
    filled.push('collect');
  }
  render();
  if(filled.length){
    setSyncStatus('synced', `Filled in the ${filled.join(' and ')} for ${entry.name}.`);
  } else {
    setSyncStatus('offline', `Found ${entry.name}, but no matching elements or BCP text on file. ${link}`);
  }
}

// Init
loadStateFromTemplate(DEFAULT_TEMPLATE);
render();
</script>
